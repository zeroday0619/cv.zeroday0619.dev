services:
  cv:
    build:
      context: .
      args:
        CV_SITE_URL: "${CV_SITE_URL:-https://cv.proxy.external.zeroday0619.dev}"
    ports:
      - "${CV_BIND_ADDRESS:-127.0.0.1}:${CV_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
